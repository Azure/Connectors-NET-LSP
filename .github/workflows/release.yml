name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 8.0.x

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 20

    - name: Restore .NET dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --no-restore --configuration Release --verbosity normal

    - name: Update extension version
      working-directory: vscode-extension
      run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version

    - name: Publish LSP server
      run: dotnet publish Server/SdkLspServer.csproj --no-build --no-restore -c Release -o vscode-extension/server

    - name: Install npm dependencies
      working-directory: vscode-extension
      run: npm ci

    - name: Compile TypeScript
      working-directory: vscode-extension
      run: npm run compile

    - name: Package VSIX
      working-directory: vscode-extension
      run: npx --no-install @vscode/vsce package

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vsix
        path: vscode-extension/*.vsix

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" vscode-extension/*.vsix --generate-notes
