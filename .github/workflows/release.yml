name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: 8.0.x

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20

    - name: Restore .NET dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --no-restore --configuration Release --verbosity normal

    - name: Update extension version
      working-directory: vscode-extension
      run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version

    - name: Publish LSP server
      run: dotnet publish Server/SdkLspServer.csproj --no-build --no-restore -c Release -o vscode-extension/server

    - name: Install npm dependencies
      working-directory: vscode-extension
      run: npm ci

    - name: Compile TypeScript
      working-directory: vscode-extension
      run: npm run compile

    - name: Package VSIX
      working-directory: vscode-extension
      run: npx --no-install @vscode/vsce package

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vsix
        path: vscode-extension/*.vsix

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" vscode-extension/*.vsix --generate-notes
