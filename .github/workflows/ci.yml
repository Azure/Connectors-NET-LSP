name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Check C# formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Lint Markdown
      run: npx markdownlint-cli2 '**/*.md'

  build-and-test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # SdkIndexConstantDiscoveryTests index the real SDK package; without it they are inconclusive.
    - name: Stage Connectors SDK package
      shell: bash
      run: |
        mkdir -p SDK
        curl --fail --silent --show-error --location \
          https://api.nuget.org/v3-flatcontainer/azure.connectors.sdk/1.0.0/azure.connectors.sdk.1.0.0.nupkg \
          --output SDK/Azure.Connectors.Sdk.1.0.0.nupkg

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
