name: Bug Report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open a file with `...`
        2. Hover over `...`
        3. See error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: lsp-version
    attributes:
      label: LSP server version
      description: The version of the LSP server or VS Code extension you are using.
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      description: The .NET runtime/SDK version (output of `dotnet --version`).
      placeholder: e.g. 8.0.300
    validations:
      required: true
